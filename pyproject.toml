[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "buildingregulariser"
authors = [{name = "Nick Wright", email = "nicholas.wright@dpird.wa.gov.au"}]
dynamic = ["version"]
description = "A Python library for regularizing building footprints in geospatial data. This library helps clean up and standardize building polygon geometries by aligning edges to principal directions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0.0",
    "numpy>=2.0.0",
]
license = "MIT"
keywords = ["building", "segmentation", "geospatial", "geodataframe", "geopandas", "regularisation", "footprint", "geometry", "regularization", "house"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["buildingregulariser*"]

[tool.setuptools.package-data]
buildingregulariser = ["py.typed"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "folium>=0.19.5",
    "ipykernel>=6.29.5",
    "mapclassify>=2.8.1",
    "matplotlib>=3.9.4",
    "mypy>=1.19",
    "pre-commit>=4.0",
    "pytest>=8.3.5",
    "rasterio>=1.4.3",
    "ruff>=0.12.4",
]

[tool.mypy]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/DPIRD-DMA/Building-Regulariser"
Repository = "https://github.com/DPIRD-DMA/Building-Regulariser"
Changelog = "https://github.com/DPIRD-DMA/Building-Regulariser/blob/main/CHANGELOG.md"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "B"]